	#Which biome-temperature categories each trait (including 'default', the vanilla texture)
	#is allowed to naturally spawn in. A wild group's location is checked once when it spawns;
	#if none of a species' traits are eligible for that biome, 'default' spawns anyway as an
	#absolute last-resort fallback regardless of this config, so groups are never left without
	#a trait. This has no effect on breeding: offspring can inherit any allele from their
	#parents regardless of what biome they're born in.
	[climate_spawning.sheep]

		[climate_spawning.sheep.patched]
			cold = false
			temperate = true
			hot = false

		[climate_spawning.sheep.rocky]
			cold = false
			temperate = true
			hot = true

		[climate_spawning.sheep.fuzzy]
			cold = true
			temperate = false
			hot = false


[crowding]
	#Controls direct damage + particles applied when too many Pigs, Cows, Sheep, and Chickens
	#are packed into a small space together - all four species count toward the same limit, and
	#Wolves are never affected. Animals need room to graze!
	#Radius in blocks used to count nearby animals around each one.
	# Default: 3.0
	# Range: 0.5 ~ 16.0
	crowd_radius = 3.0
	#Number of eligible animals within crowd_radius (including the animal itself) before it's considered crammed.
	# Default: 8
	# Range: 2 ~ 128
	crowd_threshold = 8
	#How often (in ticks) each animal re-checks its surroundings. 20 ticks = 1 second.
	# Default: 20
	# Range: 1 ~ 200
	crowd_check_interval_ticks = 20
	#Damage dealt per hit while crammed. 1 heart = 2.0.
	# Default: 2.0
	# Range: 0.0 ~ 40.0
	crammed_damage_amount = 2.0
	#Ticks between each damage hit while crammed. 20 ticks = 1 second; default 100 = 5 seconds.
	# Default: 100
	# Range: 20 ~ 2000
	crammed_damage_interval_ticks = 100

[panic]
	#Controls panic spreading: when a Pig, Cow, Sheep, or Chicken is attacked, nearby animals
	#of the same four species flee too, just as if they'd been struck themselves. Doesn't apply
	#to Wolves.
	#Radius in blocks around an attacked animal that nearby animals will also panic within.
	# Default: 8.0
	# Range: 0.5 ~ 32.0
	panic_radius = 8.0
	#Speed multiplier bystanders move at while fleeing (1.0 = normal walk speed).
	# Default: 1.5
	# Range: 0.5 ~ 5.0
	flee_speed = 1.5
	#How far in blocks a bystander tries to run away from the attacker.
	# Default: 6.0
	# Range: 1.0 ~ 20.0
	flee_distance = 6.0

[shelter_seeking]
	#Controls Pigs, Cows, Sheep, and Chickens wandering to nearby cover when it's raining or
	#snowing on them. Doesn't apply to Wolves.
	#Radius in blocks to randomly search for a covered spot.
	# Default: 10
	# Range: 2 ~ 32
	shelter_search_radius = 10
	#How often (in ticks) each animal re-checks the weather and re-paths to shelter. 20 ticks = 1 second.
	# Default: 60
	# Range: 20 ~ 400
	shelter_check_interval_ticks = 60
	#Speed multiplier while heading for shelter (1.0 = normal walk speed).
	# Default: 1.0
	# Range: 0.5 ~ 3.0
	shelter_seek_speed = 1.0

[biome_temperature]
	#Thresholds used to sort a spawn location's biome temperature into COLD / TEMPERATE / HOT.
	#Vanilla biome temperatures roughly range from about -0.5 (frozen peaks) to 2.0 (deserts/badlands);
	#0.8 is roughly plains/forest. A location is COLD at or below cold_max_temperature,
	#HOT at or above hot_min_temperature, and TEMPERATE in between.
	# Default: 0.2
	# Range: -2.0 ~ 2.0
	cold_max_temperature = 0.2
	# Default: 0.95
	# Range: -2.0 ~ 2.0
	hot_min_temperature = 0.95

	#Dominance weight per genetic trait. When an animal is heterozygous (carries two
	#different trait alleles), the allele with the HIGHER weight here determines its visible skin.
	#Equal weights fall back to whichever allele came from parent A.
	#Defaults follow the order the traits were designed in, most dominant first; 'default'
	#(vanilla texture) starts at 0, the most recessive.
	[dominance_weights.sheep]
		#sheep's 'patched' trait dominance weight
		# Default: 3.0
		# Range: 0.0 ~ 1000.0
		patched = 3.0
		#sheep's 'rocky' trait dominance weight
		# Default: 2.0
		# Range: 0.0 ~ 1000.0
		rocky = 2.0
		#sheep's 'fuzzy' trait dominance weight
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		fuzzy = 1.0
		#sheep's 'default' trait dominance weight
		# Default: 0.0
		# Range: 0.0 ~ 1000.0
		default = 0.0

	[dominance_weights.chicken]
		#chicken's 'stormy' trait dominance weight
		# Default: 7.0
		# Range: 0.0 ~ 1000.0
		stormy = 7.0
		#chicken's 'bronzed' trait dominance weight
		# Default: 6.0
		# Range: 0.0 ~ 1000.0
		bronzed = 6.0
		#chicken's 'gold_crested' trait dominance weight
		# Default: 5.0
		# Range: 0.0 ~ 1000.0
		gold_crested = 5.0
		#chicken's 'midnight' trait dominance weight
		# Default: 4.0

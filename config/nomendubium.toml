["Paleontology Table"]
	# Total time in seconds to excavate an encased fossil before it breaks.
	# 
	# Default: 60
	# Range: 5 ~ 1600
	PALEONTOLOGY_TABLE_GAME_DURATION = 60
	# Countdown in seconds shown before the excavation begins.
	# 
	# Default: 3
	# Range: 1 ~ 30
	PALEONTOLOGY_TABLE_COUNTDOWN_DURATION = 3
	# Base duration in ticks of the first tool round.
	# 
	# Default: 90
	# Range: 1 ~ 1200
	# 
	# Note: Rounds last up to twice their base duration while plenty of game time remains, and are then scaled by the round
	# duration multiplier.
	PALEONTOLOGY_TABLE_INITIAL_ROUND_DURATION = 90
	# Ticks removed from the base round duration on each new round.
	# 
	# Default: 4
	# Range: 0 ~ 1200
	PALEONTOLOGY_TABLE_ROUND_DURATION_DECREASE = 4
	# Minimum base duration in ticks a round can decrease to.
	# 
	# Default: 34
	# Range: 1 ~ 1200
	# 
	# Note: This value should be less than or equal to the initial round duration.
	PALEONTOLOGY_TABLE_MIN_ROUND_DURATION = 34
	# Extra ticks added to the base duration of chisel rounds.
	# 
	# Default: 30
	# Range: 0 ~ 1200
	PALEONTOLOGY_TABLE_CHISEL_ROUND_BONUS = 30
	# Multiplier applied to the final duration of every round.
	# 
	# Default: 0.75
	# Range: 0.05 ~ 4.0
	PALEONTOLOGY_TABLE_ROUND_DURATION_MULTIPLIER = 0.75
	# Progress added by each chisel stroke.
	# 
	# Default: 13
	# Range: 1 ~ 600
	# 
	# Note: A fossil is fully excavated at 600 progress.
	PALEONTOLOGY_TABLE_CHISEL_PROGRESS = 13
	# Progress added by each hammer hit.
	# 
	# Default: 3
	# Range: 1 ~ 600
	# 
	# Note: A fossil is fully excavated at 600 progress.
	PALEONTOLOGY_TABLE_HAMMER_PROGRESS = 3
	# Progress added by each full brush circle.
	# 
	# Default: 7
	# Range: 1 ~ 600
	# 
	# Note: A fossil is fully excavated at 600 progress.
	PALEONTOLOGY_TABLE_BRUSH_PROGRESS = 7
	# Maximum chisel strokes that count towards progress in a single round.
	# 
	# Default: 15
	# Range: 1 ~ 1000
	PALEONTOLOGY_TABLE_CHISEL_MAX_ACTIONS = 15
	# Maximum hammer hits that count towards progress in a single round.
	# 
	# Default: 100
	# Range: 1 ~ 1000
	PALEONTOLOGY_TABLE_HAMMER_MAX_ACTIONS = 100
	# Maximum brush circles that count towards progress in a single round.
	# 
	# Default: 40
	# Range: 1 ~ 1000
	PALEONTOLOGY_TABLE_BRUSH_MAX_ACTIONS = 40

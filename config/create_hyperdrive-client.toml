#.
#Client-side configs. These do not affect gameplay and are only used for visual and audio effects.
[client]
	#.
	#Enables jittering on some of the hyperdrive components during running
	enableJittering = true
	#.
	#How many rotations should the hyperdrive lid take before it triggers (does not affect the time taken)
	# Default: 4
	# Range: > 0
	rotations = 4

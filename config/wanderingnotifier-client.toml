[trader_alert]
	#How long the wandering trader is highlighted.
	#Measured in seconds.
	#Set to -1 for permanent.
	# Default: 15
	# Range: -1 ~ 3600
	glow_duration_seconds = 15
	#How the wandering trader is highlighted.
	#OUTLINE = normal trader with an outline.
	#FULL_BODY = the entire trader is highlighted.
	#Allowed Values: OUTLINE, FULL_BODY
	glow_mode = "OUTLINE"
	#Red component of the highlight color.
	# Default: 255
	# Range: 0 ~ 255
	glow_red = 255
	#Green component of the highlight color.
	# Default: 215
	# Range: 0 ~ 255
	glow_green = 215
	#Blue component of the highlight color.
	# Default: 0
	# Range: 0 ~ 255
	glow_blue = 0
